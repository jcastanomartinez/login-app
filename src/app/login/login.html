<div class="login-wrapper">
  <div class="login-card">
    <h1>Iniciar sesión</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" formControlName="email" [class.error]="emailInvalidoEnSubmit" />
        @if (emailInvalidoEnSubmit) {
          <p class="error-text">Email inválido o requerido</p>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" [class.error]="passwordInvalidoEnSubmit" />
        @if (passwordInvalidoEnSubmit) {
          <p class="error-text">Password inválida o requerida</p>
        }
      </div>

      <button type="submit">Entrar</button>
      <p class="switch-link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
    </form>
  </div>
</div>
