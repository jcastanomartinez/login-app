<div class="register-card">
  <h1>Crear cuenta</h1>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="email">Email *</label>
      <input id="email" formControlName="email" [class.error]="emailInvalidoEnSubmit" />
      @if (emailInvalidoEnSubmit) {
        <p class="error-text">Email inválido o requerido</p>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña *</label>
      <input id="password" type="password" formControlName="password" [class.error]="passwordInvalidoEnSubmit" />
      @if (passwordInvalidoEnSubmit) {
        <p class="error-text">Mínimo 8 caracteres</p>
      }
    </div>

    <div class="field-row">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" formControlName="nombre" />
      </div>
      <div class="field">
        <label for="apellidos">Apellidos</label>
        <input id="apellidos" formControlName="apellidos" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" formControlName="telefono" />
      </div>
      <div class="field">
        <label for="pais">País</label>
        <input id="pais" formControlName="pais" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="ciudad">Ciudad</label>
        <input id="ciudad" formControlName="ciudad" />
      </div>
      <div class="field">
        <label for="direccion">Dirección</label>
        <input id="direccion" formControlName="direccion" />
      </div>
    </div>

    <button type="submit">Crear cuenta</button>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</div>
